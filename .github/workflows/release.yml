name: Build release package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository without external actions
        shell: bash
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git fetch --depth 1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD

      - name: Build clean installable ZIP
        id: package
        shell: bash
        run: |
          cd repo
          VERSION=$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')
          TAG="v$VERSION"
          ZIP_NAME="moultrie-data-client-v$VERSION.zip"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $VERSION" >&2
            exit 1
          fi

          mkdir -p release-package
          cp manifest.json release-package/
          cp background.js release-package/
          cp bridge-main.js release-package/
          cp content.js release-package/
          cp popup.html release-package/
          cp popup.js release-package/
          cp popup.css release-package/
          cp help.html release-package/
          cp help.css release-package/
          cp LICENSE release-package/

          cd release-package
          zip -r "../$ZIP_NAME" .
          cd ..

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        run: |
          cd repo
          TAG="${{ steps.package.outputs.tag }}"
          ZIP_NAME="${{ steps.package.outputs.zip_name }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_NAME" --clobber
          else
            gh release create "$TAG" "$ZIP_NAME" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi
