name: Build release package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read extension version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_name=moultrie-data-client-v$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Build clean installable ZIP
        shell: bash
        run: |
          mkdir -p release-package
          cp manifest.json release-package/
          cp background.js release-package/
          cp bridge-main.js release-package/
          cp content.js release-package/
          cp popup.html release-package/
          cp popup.js release-package/
          cp popup.css release-package/
          cp help.html release-package/
          cp help.css release-package/
          cp LICENSE release-package/
          cd release-package
          zip -r "../${{ steps.version.outputs.zip_name }}" .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: moultrie-data-client-v${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.zip_name }}

      - name: Create GitHub release and attach ZIP
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.version.outputs.zip_name }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
